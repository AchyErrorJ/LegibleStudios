  <rect x="378.0" y="150" width="16" height="650" fill="url(#hatch-gypsum)" stroke="#000" stroke-width="0.5"/>
  <rect x="206.0" y="150" width="188" height="650" fill="none" stroke="#000" stroke-width="1.5"/>
