
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="70%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="#fafafa"/>

  <!-- Warped grid — curved toward the black hole, darker -->
  <g stroke="#000000" stroke-width="0.5" opacity="0.2">
    <path d="M 0 50 Q 200 52 400 50" fill="none"/>
    <path d="M 0 100 Q 200 105 400 100" fill="none"/>
    <path d="M 0 150 Q 200 165 400 150" fill="none"/>
    <path d="M 0 200 Q 200 200 400 200" fill="none" stroke-width="0.8" opacity="0.35"/>
    <path d="M 0 250 Q 200 235 400 250" fill="none"/>
    <path d="M 0 300 Q 200 295 400 300" fill="none"/>
    <path d="M 0 350 Q 200 348 400 350" fill="none"/>
    <path d="M 50 0 Q 52 200 50 400" fill="none"/>
    <path d="M 100 0 Q 105 200 100 400" fill="none"/>
    <path d="M 150 0 Q 165 200 150 400" fill="none"/>
    <path d="M 200 0 Q 200 200 200 400" fill="none" stroke-width="0.8" opacity="0.35"/>
    <path d="M 250 0 Q 235 200 250 400" fill="none"/>
    <path d="M 300 0 Q 295 200 300 400" fill="none"/>
    <path d="M 350 0 Q 348 200 350 400" fill="none"/>
  </g>

  <!-- The event horizon — smaller, clean sheared ellipse -->
  <ellipse cx="200" cy="200" rx="38" ry="40" fill="url(#shadow)" transform="rotate(-8 200 200)"/>

  <!-- The photon ring — scaled down, sharp -->
  <ellipse cx="200" cy="200" rx="40" ry="42" fill="none" stroke="#000000" stroke-width="2" transform="rotate(-8 200 200)" opacity="0.95"/>
  <ellipse cx="200" cy="200" rx="44" ry="46" fill="none" stroke="#000000" stroke-width="1" transform="rotate(-8 200 200)" opacity="0.4"/>
  <ellipse cx="200" cy="200" rx="48" ry="50" fill="none" stroke="#000000" stroke-width="0.5" transform="rotate(-8 200 200)" opacity="0.15"/>

  <!-- Typography — clean, minimal -->
  <text x="200" y="340" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="350" text-anchor="middle" fill="#000000" letter-spacing="8">LEGIBLE</text>
  <text x="200" y="366" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="450" text-anchor="middle" fill="#666666" letter-spacing="6">STUDIO</text>

  <!-- Tiny registration mark -->
  <circle cx="200" cy="200" r="1.5" fill="#000000" opacity="0.15"/>
</svg>
