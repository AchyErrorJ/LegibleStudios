<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Soft gradient for the black hole shadow -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="70%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
  </defs>

  <!-- Clean white background -->
  <rect width="400" height="400" fill="#fafafa"/>

  <!-- Concentric grid circles showing lensing distortion -->
  <g fill="none" stroke="#000000" opacity="0.08">
    <circle cx="200" cy="200" r="50"/>
    <circle cx="200" cy="200" r="75"/>
    <circle cx="200" cy="200" r="100"/>
    <circle cx="200" cy="200" r="125"/>
    <circle cx="200" cy="200" r="150"/>
    <circle cx="200" cy="200" r="175"/>
  </g>

  <!-- The event horizon -->
  <circle cx="200" cy="200" r="65" fill="url(#shadow)"/>

  <!-- The bright ring -->
  <circle cx="200" cy="200" r="68" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="72" fill="none" stroke="#000000" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="76" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.2"/>

  <!-- One sharp arc of light (Doppler effect / accretion) -->
  <path d="M 170 140 A 55 55 0 0 1 230 140" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 165 150 A 62 62 0 0 1 235 150" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

  <!-- A counter-arc below, fainter -->
  <path d="M 170 260 A 55 55 0 0 0 230 260" fill="none" stroke="#000000" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

  <!-- Typography -->
  <text x="200" y="340" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="300" text-anchor="middle" fill="#000000" letter-spacing="6">LEGIBLE</text>
  <text x="200" y="365" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#666666" letter-spacing="4">STUDIO</text>
</svg>
